[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
  # Version is pinned via devDependencies in package.json (@netlify/plugin-nextjs@5.14.7)

[[redirects]]
  from  = "https://nexus-docs.netlify.app/*"
  to    = "https://docs.nexus.gatewarden.eu/:splat"
  status = 301
  force  = true

[[redirects]]
  from  = "http://docs.nexus.gatewarden.eu/*"
  to    = "https://docs.nexus.gatewarden.eu/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Content-Security-Policy for a static docs site. 'unsafe-inline' is required
    # for the Next.js hydration bootstrap and framer-motion inline styles, since
    # static Netlify headers cannot carry a per-request nonce. The site renders
    # only build-time authored MDX (no runtime user input), so the residual XSS
    # surface is minimal. Tightening to nonce-based script-src is a follow-up.
    Content-Security-Policy   = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
