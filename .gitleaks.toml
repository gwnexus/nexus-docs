# Gitleaks configuration for nexus-docs
# Scans commits for leaked secrets before they reach the repository.

title = "nexus-docs gitleaks config"

[allowlist]
  description = "Global allowlist"
  # Sentry DSNs are public identifiers, not secrets
  regexTarget = "match"
  regexes = [
    '''NEXT_PUBLIC_SENTRY_DSN''',
    '''SENTRY_DSN''',
  ]
